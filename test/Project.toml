# The driver environment for test/validate.jl, committed on purpose: the seven packages are
# listed here even though validate.jl `Pkg.develop`s them by path, because declared here
# develop updates only the manifest and `git status` stays clean between runs. Only
# Manifest.toml stays ignored, so CI resolves against these bounds rather than a manifest
# from someone's laptop.
#
# Each package's own test dependencies live in its `[extras]`/`[targets]` block, not here.
[deps]
InfrastructureCoreOpenAPIModels = "1f5e1c8d-e0cc-4dbf-8c6d-f2a3d2ae70a8"
InfrastructureTimeSeriesOpenAPIModels = "37a216c8-a490-47cf-89d7-db2cb9618199"
Pkg = "44cfe95a-1eb2-52ea-b672-e2afdf69b78f"
PowerCoreOpenAPIModels = "b7b40286-e793-417d-a9a0-b1583e4da1cb"
PowerDynamicsOpenAPIModels = "044a0b22-31f8-4ef6-8282-c9a61b3013f6"
PowerInvestmentsOpenAPIModels = "33cb4396-f4d9-4f59-8585-787ebb56cb1b"
PowerOpenAPIModels = "0730f07c-cff6-4c3b-a9df-c546153be50a"
PowerOperationsOpenAPIModels = "a372b6d7-45a2-44c2-8199-6a724b72e8ff"

[compat]
julia = "1.10"
