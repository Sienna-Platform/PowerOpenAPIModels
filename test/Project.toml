# The test environment, committed on purpose: CI has no other way to know that
# validate.jl needs TimeZones and Dates, and without them `--project=test` resolves to an
# empty environment and the suite dies on `using TimeZones`. Only Manifest.toml stays
# ignored, so CI resolves against these bounds rather than a manifest from someone's laptop.
#
# The seven generated packages are listed even though validate.jl `Pkg.develop`s them by
# path: declared here, develop updates only the manifest, and `git status` stays clean
# between runs.
[deps]
Dates = "ade2ca70-3891-5945-98fb-dc099432e06a"
InfrastructureCoreOpenAPIModels = "1f5e1c8d-e0cc-4dbf-8c6d-f2a3d2ae70a8"
InfrastructureTimeSeriesOpenAPIModels = "37a216c8-a490-47cf-89d7-db2cb9618199"
OpenAPI = "d5e62ea6-ddf3-4d43-8e4c-ad5e6c8bfd7d"
Pkg = "44cfe95a-1eb2-52ea-b672-e2afdf69b78f"
PowerCoreOpenAPIModels = "b7b40286-e793-417d-a9a0-b1583e4da1cb"
PowerDynamicsOpenAPIModels = "044a0b22-31f8-4ef6-8282-c9a61b3013f6"
PowerInvestmentsOpenAPIModels = "33cb4396-f4d9-4f59-8585-787ebb56cb1b"
PowerOpenAPIModels = "0730f07c-cff6-4c3b-a9df-c546153be50a"
PowerOperationsOpenAPIModels = "a372b6d7-45a2-44c2-8199-6a724b72e8ff"
TOML = "fa267f1f-6049-4f14-aa54-33bafae1ed76"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"
TimeZones = "f269a46b-ccf7-5d73-abea-4c690281aa53"

[compat]
OpenAPI = "1.1.2"
TimeZones = "1"
julia = "1.10"
