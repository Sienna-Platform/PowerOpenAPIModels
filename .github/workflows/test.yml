name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (julia ${{ matrix.julia-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor every package declares in [compat], and the current release. A
        # generated package that loads on one and not the other is a compat bug, and
        # the floor is the one nobody tests locally. Both are pinned rather than
        # written as "1": a moving channel turns somebody else's release into this
        # repository's red build, with nothing in the diff to explain it.
        julia-version: ["1.10", "1.13"]
    steps:
      - uses: actions/checkout@v4

      # test/validate.jl reads Core/SystemDocument.json and the unit vocabulary from the
      # schema release this output was generated against. .schema-version names it -- a
      # release tag once the schemas are released, a commit sha between releases -- and
      # either works as a checkout ref.
      - name: Resolve the schema version this output was generated against
        id: schema
        run: echo "ref=$(cat .schema-version)" >> "$GITHUB_OUTPUT"

      - name: Check out SiennaSchemas at that version
        uses: actions/checkout@v4
        with:
          repository: Sienna-Platform/SiennaSchemas
          ref: ${{ steps.schema.outputs.ref }}
          path: SiennaSchemas

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      # validate.jl does its own Pkg.develop of the seven packages, so there is nothing
      # to instantiate first: test/Manifest.toml is git-ignored and a fresh checkout has
      # none, which is the point -- CI resolves against the Project.toml bounds rather
      # than a manifest someone's laptop pinned. It then runs each package's own
      # `test/runtests.jl` through `Pkg.test`, the same entry point a user of the
      # registered package gets.
      - name: Run every package's test suite
        env:
          SCHEMA_DIR: ${{ github.workspace }}/SiennaSchemas
          # Only the leg that uploads it: instrumenting the other one costs time and
          # discards the cached pkgimages for nothing.
          COVERAGE: ${{ matrix.julia-version == '1.13' && '1' || '' }}
        run: julia --project=test test/validate.jl

      # Coverage lands as `<Package>.jl/src/**.jl.cov`, one directory per package, so every
      # one has to be named: the action's default is a single `src`.
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.julia-version == '1.13'
        with:
          directories: InfrastructureCoreOpenAPIModels.jl/src,InfrastructureTimeSeriesOpenAPIModels.jl/src,PowerCoreOpenAPIModels.jl/src,PowerOperationsOpenAPIModels.jl/src,PowerInvestmentsOpenAPIModels.jl/src,PowerDynamicsOpenAPIModels.jl/src,PowerOpenAPIModels.jl/src

      - uses: codecov/codecov-action@v7
        if: matrix.julia-version == '1.13'
        with:
          files: ./lcov.info
          disable_search: true
          flags: unittests
          slug: ${{ github.repository }}
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  precompile:
    name: precompile (julia ${{ matrix.julia-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Precompilation is the part of loading that changes most between Julia
        # releases, so it is checked on the same two versions rather than one.
        julia-version: ["1.10", "1.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}

      - uses: julia-actions/cache@v2

      # See the header of test/precompile.jl for why `using` and `Pkg.precompile` both
      # pass on the failure this catches.
      - name: Precompile all seven
        run: julia test/precompile.jl
