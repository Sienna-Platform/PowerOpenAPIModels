name: TagBot

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        description: How many days back to look for merged registry PRs
        default: "3"
        required: false

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    # The comment trigger fires on every issue and PR comment in the repository; only
    # TagBot's own trigger comment should start a run.
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    strategy:
      # One package's tagging must not cancel the others: after a registry wave merges,
      # several of these run at once and they are independent.
      fail-fast: false
      max-parallel: 1
      matrix:
        subdir:
          - InfrastructureCoreOpenAPIModels.jl
          - InfrastructureTimeSeriesOpenAPIModels.jl
          - PowerCoreOpenAPIModels.jl
          - PowerOperationsOpenAPIModels.jl
          - PowerInvestmentsOpenAPIModels.jl
          - PowerDynamicsOpenAPIModels.jl
          - PowerOpenAPIModels.jl
    steps:
      # One job per package, because seven packages share this repository and a tag has to
      # say which one it belongs to. Without `subdir` TagBot would tag the repository once
      # per registered version and the seven would collide on `v0.1.0`.
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          subdir: ${{ matrix.subdir }}
          lookback: ${{ github.event.inputs.lookback || 3 }}
