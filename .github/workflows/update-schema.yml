name: Update from Schema Release

# SiennaSchemas' release workflow dispatches schema-release with the new tag.
# The cron is a backstop for a missed dispatch: a run whose tag is already in
# .schema-version is a no-op. Merging the PR this opens is the release -- see
# release-on-merge.yml.
on:
  repository_dispatch:
    types: [schema-release]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "SiennaSchemas release tag (default: the latest release)"
        required: false

permissions:
  contents: write
  pull-requests: write
  packages: read

# A dispatch and a cron run for the same tag must not race on one PR branch.
concurrency:
  group: update-schema
  cancel-in-progress: false

env:
  CODEGEN_IMAGE: ghcr.io/sienna-platform/power-codegen:latest

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the schema release
        id: schema
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Passed through env, never interpolated into the script: the payload
          # is caller-supplied text.
          REQUESTED: ${{ github.event.client_payload.tag || inputs.tag }}
        run: |
          LATEST="${REQUESTED:-$(gh release view --repo Sienna-Platform/SiennaSchemas --json tagName -q .tagName)}"
          if ! [[ "$LATEST" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$LATEST' is not a SiennaSchemas release tag" >&2
            exit 1
          fi
          CURRENT=$(cat .schema-version 2>/dev/null || echo "none")
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "changed=$( [ "$LATEST" != "$CURRENT" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Download schemas
        if: steps.schema.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ steps.schema.outputs.latest }} \
            --repo Sienna-Platform/SiennaSchemas --pattern '*.tar.gz' --dir /tmp
          tar -xzf /tmp/schemas-*.tar.gz -C /tmp

      - name: Login to GHCR
        if: steps.schema.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate types
        if: steps.schema.outputs.changed == 'true'
        run: |
          docker run --rm \
            -v /tmp/schemas:/schemas:ro \
            -v ${{ github.workspace }}:/output \
            $CODEGEN_IMAGE
          echo "${{ steps.schema.outputs.latest }}" > .schema-version

      - name: Bump the package versions
        id: bump
        if: steps.schema.outputs.changed == 'true'
        run: |
          version=$(python3 .github/scripts/bump_version.py \
            "${{ steps.schema.outputs.current }}" "${{ steps.schema.outputs.latest }}")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # No validation step here: the Test workflow runs every package's suite on
      # this PR (Julia 1.10 and 1.13), which is why the PR must not be opened
      # with GITHUB_TOKEN -- a PR it opens triggers no workflows.
      - uses: actions/create-github-app-token@v1
        id: app-token
        if: steps.schema.outputs.changed == 'true'
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Open Pull Request
        if: steps.schema.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: auto/schema-${{ steps.schema.outputs.latest }}
          title: "chore: update to schema ${{ steps.schema.outputs.latest }} (v${{ steps.bump.outputs.version }})"
          body: |
            Auto-generated from [SiennaSchemas ${{ steps.schema.outputs.latest }}](https://github.com/Sienna-Platform/SiennaSchemas/releases/tag/${{ steps.schema.outputs.latest }}).

            **Merging this PR registers all seven packages at v${{ steps.bump.outputs.version }}** in General.
          commit-message: "chore: regenerate types from schema ${{ steps.schema.outputs.latest }}"
