# The documentation environment. The seven packages resolve from this checkout rather than
# from the registry, so the site always documents the code in the tree it is built from.
[deps]
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
InfrastructureCoreOpenAPIModels = "1f5e1c8d-e0cc-4dbf-8c6d-f2a3d2ae70a8"
InfrastructureTimeSeriesOpenAPIModels = "37a216c8-a490-47cf-89d7-db2cb9618199"
JSON = "682c06a0-de6a-54ab-a142-c8b1cf79cde6"
PowerCoreOpenAPIModels = "b7b40286-e793-417d-a9a0-b1583e4da1cb"
PowerDynamicsOpenAPIModels = "044a0b22-31f8-4ef6-8282-c9a61b3013f6"
PowerInvestmentsOpenAPIModels = "33cb4396-f4d9-4f59-8585-787ebb56cb1b"
PowerOpenAPIModels = "0730f07c-cff6-4c3b-a9df-c546153be50a"
PowerOperationsOpenAPIModels = "a372b6d7-45a2-44c2-8199-6a724b72e8ff"

[sources]
InfrastructureCoreOpenAPIModels = {path = "../InfrastructureCoreOpenAPIModels.jl"}
InfrastructureTimeSeriesOpenAPIModels = {path = "../InfrastructureTimeSeriesOpenAPIModels.jl"}
PowerCoreOpenAPIModels = {path = "../PowerCoreOpenAPIModels.jl"}
PowerDynamicsOpenAPIModels = {path = "../PowerDynamicsOpenAPIModels.jl"}
PowerInvestmentsOpenAPIModels = {path = "../PowerInvestmentsOpenAPIModels.jl"}
PowerOpenAPIModels = {path = "../PowerOpenAPIModels.jl"}
PowerOperationsOpenAPIModels = {path = "../PowerOperationsOpenAPIModels.jl"}

[compat]
Documenter = "1"
# 1.11, not the packages' 1.10 floor: the [sources] block above is a 1.11 feature. The docs
# build runs on the current release, so this constrains nothing in practice.
julia = "1.11"
